<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pergerakan Pegawai - Bahagian Kejuruteraan Negeri</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #3498db;
            --success: #27ae60;
            --danger: #e74c3c;
            --light: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            color: var(--primary);
            text-align: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
        }

        .form-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--secondary);
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        #lokasiWrapper {
            grid-column: span 2;
            background: #f9f9f9;
            padding: 10px;
            border-left: 4px solid var(--accent);
            display: none;
            margin-bottom: 15px;
        }

        .btn-main {
            width: 100%;
            padding: 12px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }

        .btn-update { background-color: var(--success); }

        hr { margin: 30px 0; border: 0; border-top: 1px solid #eee; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }

        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #ddd; }

        th { background-color: var(--primary); color: white; }

        tr:hover { background-color: #f1f1f1; }

        .action-btns { display: flex; gap: 5px; }

        .btn-edit {
            background-color: var(--success);
            padding: 6px 12px;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-delete {
            background-color: var(--danger);
            padding: 6px 12px;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            color: white;
            font-weight: bold;
            text-transform: uppercase;
        }

        .bg-cuti { background: #f39c12; }
        .bg-mc { background: #e74c3c; }
        .bg-el { background: #9b59b6; }
        .bg-mesyuarat { background: #2ecc71; }
        .bg-lawatan { background: #3498db; }

        .lokasi-text {
            display: block;
            font-size: 12px;
            color: #666;
            margin-top: 4px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 id="formTitle">Perekodan Pergerakan Pegawai</h2>
    
    <form id="movementForm">
        <input type="hidden" id="editId">
        <div class="form-group">
            <div>
                <label>Nama Pegawai</label>
                <select id="namaSelect" onchange="autoSelectUnit()" required>
                    <option value="">-- Pilih Nama Pegawai --</option>
                </select>
            </div>
            <div>
                <label>Unit</label>
                <select id="unitSelect" required>
                    <option value="">-- Pilih Unit --</option>
                    <option value="Pengurusan Kejuruteraan">Pengurusan Kejuruteraan</option>
                    <option value="Unit Implementasi Projek">Unit Implementasi Projek</option>
                    <option value="Unit Perancangan Kejuruteraan Kesihatan">Unit Perancangan Kejuruteraan Kesihatan</option>
                    <option value="Unit Kawalselia Fasiliti Kesihatan">Unit Kawalselia Fasiliti Kesihatan</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <div>
                <label>Tujuan</label>
                <select id="tujuan" onchange="toggleLokasi()" required>
                    <option value="Cuti">Cuti</option>
                    <option value="MC">MC</option>
                    <option value="EL">EL</option>
                    <option value="Mesyuarat">Mesyuarat</option>
                    <option value="Lawatan">Lawatan</option>
                </select>
            </div>
            <div>
                <label>Tarikh Keluar</label>
                <input type="date" id="tarikhKeluar" required>
            </div>
        </div>

        <div id="lokasiWrapper">
            <label>Lokasi (Nama Tempat / Bilik Mesyuarat)</label>
            <input type="text" id="lokasi" placeholder="Contoh: Bilik Mesyuarat Utama">
        </div>

        <div class="form-group">
            <div style="grid-column: span 2;">
                <label>Tempoh Pergerakan</label>
                <input type="text" id="tempoh" placeholder="Cth: 1 hari, 2 jam, 1 minggu" required>
            </div>
        </div>

        <button type="submit" id="submitBtn" class="btn-main">Simpan Rekod Pergerakan</button>
        <button type="button" id="cancelEditBtn" style="display:none; background:#95a5a6; margin-top:5px;" class="btn-main" onclick="cancelEdit()">Batal Kemaskini</button>
    </form>

    <hr>

    <h3>Ringkasan Pergerakan (Susunan Mengikut Nama)</h3>
    <div style="overflow-x:auto;">
        <table>
            <thead>
                <tr>
                    <th>Nama Pegawai & Unit</th>
                    <th>Tujuan & Lokasi</th>
                    <th>Tarikh & Tempoh</th>
                    <th>Tindakan</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const database = [
        { nama: "Ir. Yusri Bin Harun", unit: "Pengurusan Kejuruteraan" },
        { nama: "Rosidah Bt Hamzah", unit: "Pengurusan Kejuruteraan" },
        { nama: "Amini Nadhirah Binti Ariffin", unit: "Pengurusan Kejuruteraan" },
        { nama: "Harizah Binti Hamzah", unit: "Unit Implementasi Projek" },
        { nama: "Ir. Ts. Mohamad Fakhruruddin Bin Romeli", unit: "Unit Implementasi Projek" },
        { nama: "Wan Zuhrah bin Wan Ali", unit: "Unit Implementasi Projek" },
        { nama: "Hod Salleh Bin Amran", unit: "Unit Implementasi Projek" },
        { nama: "Aliffadillah Bin Jaffar", unit: "Unit Implementasi Projek" },
        { nama: "Mohd Sani Bin Zahari", unit: "Unit Implementasi Projek" },
        { nama: "Siti Nur Amalina Binti Kamaruddin", unit: "Unit Perancangan Kejuruteraan Kesihatan" },
        { nama: "Ts Mohd Anuar Bin Omar", unit: "Unit Perancangan Kejuruteraan Kesihatan" },
        { nama: "Mohd Nor Aizuddin bin Che Adanan", unit: "Unit Perancangan Kejuruteraan Kesihatan" },
        { nama: "Nor Fadila binti Razalli", unit: "Unit Perancangan Kejuruteraan Kesihatan" },
        { nama: "Mohd Shafri Shazwan bin Jusoh @ Hamzah", unit: "Unit Perancangan Kejuruteraan Kesihatan" },
        { nama: "Mohd Daud Khassetia bin Mohd Pauzi", unit: "Unit Perancangan Kejuruteraan Kesihatan" },
        { nama: "Zakaria bin Alias", unit: "Unit Perancangan Kejuruteraan Kesihatan" },
        { nama: "Nor Mukri Bin Che Yeem", unit: "Unit Kawalselia Fasiliti Kesihatan" },
        { nama: "Siti Salameah Binti Mat Puji", unit: "Unit Kawalselia Fasiliti Kesihatan" },
        { nama: "Norul Nadia Binti Ngah", unit: "Unit Kawalselia Fasiliti Kesihatan" },
        { nama: "Mohd Azwadi Bin Mohd Umar", unit: "Unit Kawalselia Fasiliti Kesihatan" },
        { nama: "Mohd Zamri Bin Abdullah", unit: "Unit Kawalselia Fasiliti Kesihatan" },
        { nama: "Nadiah binti Abd Ghani", unit: "Unit Kawalselia Fasiliti Kesihatan" },
        { nama: "Wan Muhammad Na'im bin Wan Kamaruddin", unit: "Unit Kawalselia Fasiliti Kesihatan" }
    ];

    const form = document.getElementById('movementForm');
    const namaSelect = document.getElementById('namaSelect');
    const unitSelect = document.getElementById('unitSelect');
    const tujuanSelect = document.getElementById('tujuan');
    const lokasiWrapper = document.getElementById('lokasiWrapper');
    const lokasiInput = document.getElementById('lokasi');
    const tempohInput = document.getElementById('tempoh');
    const submitBtn = document.getElementById('submitBtn');
    const editIdInput = document.getElementById('editId');
    const cancelEditBtn = document.getElementById('cancelEditBtn');

    function populateNama() {
        database.sort((a, b) => a.nama.localeCompare(b.nama)).forEach(staff => {
            let option = document.createElement('option');
            option.value = staff.nama;
            option.textContent = staff.nama;
            namaSelect.appendChild(option);
        });
    }

    function autoSelectUnit() {
        const selectedStaff = database.find(s => s.nama === namaSelect.value);
        if (selectedStaff) unitSelect.value = selectedStaff.unit;
    }

    function toggleLokasi() {
        if (tujuanSelect.value === "Mesyuarat" || tujuanSelect.value === "Lawatan") {
            lokasiWrapper.style.display = "block";
            lokasiInput.required = true;
        } else {
            lokasiWrapper.style.display = "none";
            lokasiInput.required = false;
            lokasiInput.value = "";
        }
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        let records = JSON.parse(localStorage.getItem('pergerakan')) || [];
        
        const recordData = {
            id: editIdInput.value ? parseInt(editIdInput.value) : Date.now(),
            nama: namaSelect.value,
            unit: unitSelect.value,
            tujuan: tujuanSelect.value,
            lokasi: lokasiInput.value,
            keluar: document.getElementById('tarikhKeluar').value,
            tempoh: tempohInput.value
        };

        if (editIdInput.value) {
            const index = records.findIndex(r => r.id === recordData.id);
            records[index] = recordData;
            alert("Rekod telah dikemaskini!");
        } else {
            records.push(recordData);
        }

        localStorage.setItem('pergerakan', JSON.stringify(records));
        cancelEdit();
        displayRecords();
    });

    function displayRecords() {
        let records = JSON.parse(localStorage.getItem('pergerakan')) || [];
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = '';

        records.sort((a, b) => a.nama.localeCompare(b.nama) || new Date(a.keluar) - new Date(b.keluar));

        records.forEach(rec => {
            const infoLokasi = rec.lokasi ? `<span class="lokasi-text">📍 ${rec.lokasi}</span>` : '';
            
            tableBody.innerHTML += `
                <tr>
                    <td><strong>${rec.nama}</strong><br><small style="color:#666">${rec.unit}</small></td>
                    <td><span class="badge bg-${rec.tujuan.toLowerCase()}">${rec.tujuan}</span>${infoLokasi}</td>
                    <td>${formatDate(rec.keluar)} (${rec.tempoh})</td>
                    <td>
                        <div class="action-btns">
                            <button class="btn-edit" onclick="editRecord(${rec.id})">Edit</button>
                            <button class="btn-delete" onclick="deleteRecord(${rec.id})">Padam</button>
                        </div>
                    </td>
                </tr>`;
        });
    }

    function editRecord(id) {
        let records = JSON.parse(localStorage.getItem('pergerakan')) || [];
        const rec = records.find(r => r.id === id);
        
        if (rec) {
            editIdInput.value = rec.id;
            namaSelect.value = rec.nama;
            unitSelect.value = rec.unit;
            tujuanSelect.value = rec.tujuan;
            toggleLokasi();
            lokasiInput.value = rec.lokasi;
            document.getElementById('tarikhKeluar').value = rec.keluar;
            tempohInput.value = rec.tempoh;

            submitBtn.textContent = "Kemaskini Rekod";
            submitBtn.classList.add('btn-update');
            cancelEditBtn.style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    function cancelEdit() {
        form.reset();
        editIdInput.value = "";
        submitBtn.textContent = "Simpan Rekod Pergerakan";
        submitBtn.classList.remove('btn-update');
        cancelEditBtn.style.display = "none";
        toggleLokasi();
    }

    function deleteRecord(id) {
        if(confirm('Padam rekod ini?')) {
            let records = JSON.parse(localStorage.getItem('pergerakan')) || [];
            localStorage.setItem('pergerakan', JSON.stringify(records.filter(r => r.id !== id)));
            displayRecords();
        }
    }

    function formatDate(dateString) {
        if(!dateString) return "";
        const [y, m, d] = dateString.split('-');
        return `${d}/${m}/${y}`;
    }

    populateNama();
    displayRecords();
</script>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA3m4GL0Nke7spCwDm8GcZDo1yoYGLKbtc",
  authDomain: "sistem-rekod-fail.firebaseapp.com",
  projectId: "sistem-rekod-fail",
  storageBucket: "sistem-rekod-fail.firebasestorage.app",
  messagingSenderId: "543329165251",
  appId: "1:543329165251:web:0bb357cc5a31e7065de776",
  measurementId: "G-YBKTH94T4B"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.db = db;
window.addDoc = addDoc;
window.getDocs = getDocs;
window.collection = collection;

</script>
</body>
</html>
