<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pergerakan Pegawai (Cloud Version)</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc, updateDoc, getDoc } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- GANTIKAN DENGAN FIREBASE CONFIG ANDA DI SINI ---
        const firebaseConfig = {
  apiKey: "AIzaSyA3m4GL0Nke7spCwDm8GcZDo1yoYGLKbtc",
  authDomain: "sistem-rekod-fail.firebaseapp.com",
  projectId: "sistem-rekod-fail",
  storageBucket: "sistem-rekod-fail.firebasestorage.app",
  messagingSenderId: "543329165251",
  appId: "1:543329165251:web:0bb357cc5a31e7065de776",
  measurementId: "G-YBKTH94T4B"
};

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const colRef = collection(db, "pergerakan");

        // UI Elements
        const form = document.getElementById('movementForm');
        const tableBody = document.getElementById('tableBody');
        const submitBtn = document.getElementById('submitBtn');
        const editIdInput = document.getElementById('editId');
        const cancelEditBtn = document.getElementById('cancelEditBtn');

        // 1. PAPAR DATA (Real-time)
        const q = query(colRef);
        onSnapshot(q, (snapshot) => {
            let records = [];
            snapshot.docs.forEach(doc => records.push({ ...doc.data(), id: doc.id }));
            
            // Susun secara manual mengikut Nama Pegawai
            records.sort((a, b) => a.nama.localeCompare(b.nama) || new Date(a.keluar) - new Date(b.keluar));
            
            renderTable(records);
        });

        function renderTable(data) {
            tableBody.innerHTML = '';
            data.forEach(rec => {
                const infoLokasi = rec.lokasi ? `<span class="lokasi-text">📍 ${rec.lokasi}</span>` : '';
                tableBody.innerHTML += `
                    <tr>
                        <td><strong>${rec.nama}</strong><br><small style="color:#666">${rec.unit}</small></td>
                        <td><span class="badge bg-${rec.tujuan.toLowerCase()}">${rec.tujuan}</span>${infoLokasi}</td>
                        <td>${formatDate(rec.keluar)} (${rec.tempoh})</td>
                        <td>
                            <div class="action-btns">
                                <button class="btn-edit" data-id="${rec.id}">Edit</button>
                                <button class="btn-delete" data-id="${rec.id}">Padam</button>
                            </div>
                        </td>
                    </tr>`;
            });

            // Re-attach event listeners for edit/delete
            document.querySelectorAll('.btn-edit').forEach(btn => btn.onclick = () => editRecord(btn.dataset.id));
            document.querySelectorAll('.btn-delete').forEach(btn => btn.onclick = () => deleteRecord(btn.dataset.id));
        }

        // 2. SIMPAN / UPDATE DATA
        form.onsubmit = async (e) => {
            e.preventDefault();
            const recordData = {
                nama: document.getElementById('namaSelect').value,
                unit: document.getElementById('unitSelect').value,
                tujuan: document.getElementById('tujuan').value,
                lokasi: document.getElementById('lokasi').value,
                keluar: document.getElementById('tarikhKeluar').value,
                tempoh: document.getElementById('tempoh').value,
                timestamp: new Date()
            };

            try {
                if (editIdInput.value) {
                    const docRef = doc(db, "pergerakan", editIdInput.value);
                    await updateDoc(docRef, recordData);
                    alert("Rekod dikemaskini!");
                } else {
                    await addDoc(colRef, recordData);
                    alert("Rekod disimpan!");
                }
                cancelEdit();
            } catch (err) {
                console.error("Error: ", err);
            }
        };

        // 3. DELETE
        window.deleteRecord = async (id) => {
            if(confirm('Padam rekod ini?')) {
                await deleteDoc(doc(db, "pergerakan", id));
            }
        };

        // 4. EDIT
        window.editRecord = async (id) => {
            const docSnap = await getDoc(doc(db, "pergerakan", id));
            if (docSnap.exists()) {
                const rec = docSnap.data();
                editIdInput.value = id;
                document.getElementById('namaSelect').value = rec.nama;
                document.getElementById('unitSelect').value = rec.unit;
                document.getElementById('tujuan').value = rec.tujuan;
                toggleLokasi();
                document.getElementById('lokasi').value = rec.lokasi;
                document.getElementById('tarikhKeluar').value = rec.keluar;
                document.getElementById('tempoh').value = rec.tempoh;

                submitBtn.textContent = "Kemaskini Rekod";
                submitBtn.classList.add('btn-update');
                cancelEditBtn.style.display = "block";
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };

        window.cancelEdit = () => {
            form.reset();
            editIdInput.value = "";
            submitBtn.textContent = "Simpan Rekod Pergerakan";
            submitBtn.classList.remove('btn-update');
            cancelEditBtn.style.display = "none";
            toggleLokasi();
        };

        // Helper: Format Date
        function formatDate(dateString) {
            if(!dateString) return "";
            const [y, m, d] = dateString.split('-');
            return `${d}/${m}/${y}`;
        }
    </script>

    <style>
        /* Gaya CSS Kekal Sama Seperti Sebelum Ini */
        :root { --primary: #2c3e50; --secondary: #34495e; --accent: #3498db; --success: #27ae60; --danger: #e74c3c; --light: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--light); padding: 20px; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; border-bottom: 2px solid var(--accent); padding-bottom: 10px; }
        .form-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        select, input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; }
        #lokasiWrapper { grid-column: span 2; background: #f9f9f9; padding: 10px; border-left: 4px solid var(--accent); display: none; margin-bottom: 15px; }
        .btn-main { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-update { background-color: var(--success); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #ddd; }
        th { background: var(--primary); color: white; }
        .action-btns { display: flex; gap: 5px; }
        .btn-edit { background: var(--success); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .btn-delete { background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; color: white; font-weight: bold; text-transform: uppercase; }
        .bg-cuti { background: #f39c12; } .bg-mc { background: #e74c3c; } .bg-el { background: #9b59b6; } .bg-mesyuarat { background: #2ecc71; } .bg-lawatan { background: #3498db; }
        .lokasi-text { display: block; font-size: 12px; color: #666; font-style: italic; margin-top: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Perekodan Pergerakan Pegawai (Cloud)</h2>
    <form id="movementForm">
        <input type="hidden" id="editId">
        <div class="form-group">
            <div>
                <label>Nama Pegawai</label>
                <select id="namaSelect" onchange="autoSelectUnit()" required>
                    <option value="">-- Pilih Nama Pegawai --</option>
                </select>
            </div>
            <div>
                <label>Unit</label>
                <select id="unitSelect" required>
                    <option value="">-- Pilih Unit --</option>
                    <option value="Pengurusan Kejuruteraan">Pengurusan Kejuruteraan</option>
                    <option value="Unit Implementasi Projek">Unit Implementasi Projek</option>
                    <option value="Unit Perancangan Kejuruteraan Kesihatan">Unit Perancangan Kejuruteraan Kesihatan</option>
                    <option value="Unit Kawalselia Fasiliti Kesihatan">Unit Kawalselia Fasiliti Kesihatan</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <div><label>Tujuan</label><select id="tujuan" onchange="toggleLokasi()" required><option value="Cuti">Cuti</option><option value="MC">MC</option><option value="EL">EL</option><option value="Mesyuarat">Mesyuarat</option><option value="Lawatan">Lawatan</option></select></div>
            <div><label>Tarikh Keluar</label><input type="date" id="tarikhKeluar" required></div>
        </div>
        <div id="lokasiWrapper"><label>Lokasi</label><input type="text" id="lokasi" placeholder="Nama Tempat"></div>
        <div class="form-group"><div style="grid-column: span 2;"><label>Tempoh</label><input type="text" id="tempoh" placeholder="Cth: 2 hari" required></div></div>
        <button type="submit" id="submitBtn" class="btn-main">Simpan Rekod Pergerakan</button>
        <button type="button" id="cancelEditBtn" style="display:none; background:#95a5a6;" class="btn-main">Batal Kemaskini</button>
    </form>
    <hr>
    <h3>Ringkasan Pergerakan</h3>
    <div style="overflow-x:auto;">
        <table>
            <thead><tr><th>Nama & Unit</th><th>Tujuan</th><th>Tarikh & Tempoh</th><th>Tindakan</th></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>

    const database = [
        { nama: "Ir. Yusri Bin Harun", unit: "Pengurusan Kejuruteraan" },
        { nama: "Rosidah Bt Hamzah", unit: "Pengurusan Kejuruteraan" },

        { nama: "Wan Muhammad Na'im bin Wan Kamaruddin", unit: "Unit Kawalselia Fasiliti Kesihatan" }
    ];

    const namaSelect = document.getElementById('namaSelect');
    const unitSelect = document.getElementById('unitSelect');
    const tujuanSelect = document.getElementById('tujuan');
    const lokasiWrapper = document.getElementById('lokasiWrapper');

    function populateNama() {
        database.sort((a, b) => a.nama.localeCompare(b.nama)).forEach(staff => {
            let option = document.createElement('option');
            option.value = staff.nama; option.textContent = staff.nama;

        });

    window.autoSelectUnit = () => {
        const selected = database.find(s => s.nama === namaSelect.value);
        if (selected) unitSelect.value = selected.unit;
    };

    window.toggleLokasi = () => {
        const show = (tujuanSelect.value === "Mesyuarat" || tujuanSelect.value === "Lawatan");
        lokasiWrapper.style.display = show ? "block" : "none";
        document.getElementById('lokasi').required = show;
    };

    populateNama();
</script>
</body>
</html>
